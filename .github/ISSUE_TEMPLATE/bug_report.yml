name: 🐛 Bug 报告
description: 报告可复现的缺陷或异常行为
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请先搜索是否已有相同问题。
        **请勿上传原始 ERA5 数据**，只需提供数据卷 ID 与时间范围。

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 清晰描述实际行为与预期行为的差异
      placeholder: 运行 xxx 时，期望得到 A，实际得到 B
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请提供可直接执行的完整命令
      render: bash
      placeholder: |
        python3 scripts/demo/make_tp_cloud_water_fixture.py /tmp/tp_fixture --days 3
        PYTHONPATH=src:. python3 -m experiments.tp_cloud_water.eda --config /tmp/tp_fixture/config.yaml --run-id bug
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: 完整报错
      description: 粘贴完整 traceback，不要只截取最后一行
      render: shell

  - type: dropdown
    id: layer
    attributes:
      label: 出问题的环节
      description: 对应项目五个环节
      options:
        - 数学原理 / 公式实现
        - 代理指标（PW / RH / CFRAC）
        - 收支模型（budget.py / GCWR）
        - 误差分析（error_analysis.py）
        - 制图（plot.py）
        - 可复现契约（manifest）
        - 独立验收（validate_real_eda.py）
        - CI / 工程配置
        - 文档
        - 其他
    validations:
      required: true

  - type: dropdown
    id: env
    attributes:
      label: 运行环境
      options:
        - 合成数据自检（不涉及外接盘）
        - 真实外接 ERA5 卷
        - 两者都出现
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 请粘贴
      render: text
      value: |
        - Python 版本：
        - 操作系统：
        - 关键依赖版本（numpy/xarray/dask 等）：
        - 是否在线 CI 中复现：
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 Issue，未发现重复
          required: true
        - label: 我已尝试用合成数据自检链路复现（若可能）
          required: false
